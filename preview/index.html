     c.fillStyle=j%2?'#33424b':'#293943';c.fillRect(px-2,87-height,4,height*2);
     c.fillStyle='#67736f';c.fillRect(px-3,85-height,6,2);
     if(j%2===0){c.fillStyle='#57452f';c.fillRect(px+side*5,85-height/2,5+depth*7,5+depth*6)}
   }
 }
 // Flickering ceiling luminaires and overhead wire shadows.
 for(let j=0;j<4;j++){
   const d=j/4,yy=7+d*d*49,w=9+d*22;
   c.fillStyle=Math.sin(t/280+j*5)>.87?'#d5b77e':'#9b895e';c.fillRect(160-w/2,yy,w,3+d*2);
   c.fillStyle='#d1b87b13';c.fillRect(160-w,yy+4,w*2,7+d*5);
 }
 // Ground debris and surface scuffs, increasing in size toward the camera.
 for(let j=0;j<30;j++){
   const x=(j*83+19)%320,y=139+((j*47)%60),sz=1+Math.floor((y-135)/19);
   c.fillStyle=j%4===0?'#6c6556':'#3d4547';c.fillRect(x,y+stride,sz*2,sz);
 }
 c.restore();
};

/* Art pass 2: high-contrast industrial corridor. Intentionally obvious at 320x200. */
const oldIndustrialDraw=drawScene;
drawScene=function(canvas,t=0){
 oldIndustrialDraw(canvas,t);
 if(canvas.dataset.scene!=='pov')return;
 const c=canvas.getContext('2d');c.save();c.imageSmoothingEnabled=false;
 const vanX=160,vanY=92,beat=Math.sin(t/130)*2;
 // Floor with strongly visible tiles, scratches and hazard strips.
 c.fillStyle='#252e32';c.beginPath();c.moveTo(104,130);c.lineTo(216,130);c.lineTo(320,200);c.lineTo(0,200);c.fill();
 for(let i=1;i<=5;i++){let d=i/5,y=130+70*d*d;c.strokeStyle=i%2?'#62716b':'#445450';c.lineWidth=1+d*2;c.beginPath();c.moveTo(160-160*d,y);c.lineTo(160+160*d,y);c.stroke()}
 for(let k=-3;k<=3;k++){c.strokeStyle='#485650';c.lineWidth=2;c.beginPath();c.moveTo(160+k*10,130);c.lineTo(160+k*47,200);c.stroke()}
 // Two large pipes on left wall, with bright metal brackets.
 for(let x of [12,28]){c.strokeStyle=x===12?'#987d5d':'#526d73';c.lineWidth=8;c.beginPath();c.moveTo(x,-10);c.lineTo(119,70);c.stroke();c.strokeStyle='#b5a187';c.lineWidth=2;c.beginPath();c.moveTo(x+2,0);c.lineTo(119,70);c.stroke()}
 for(let y of [35,80,125]){let x=18+y*.48;c.fillStyle='#a9a8a0';c.fillRect(x-5,y-3,16,6);c.fillStyle='#1b2528';c.fillRect(x,y-2,8,4)}
 // Right wall: emergency boxes, exposed wiring, and torn caution posters.
 c.fillStyle='#5b4940';c.fillRect(265,62,34,42);c.fillStyle='#1a242b';c.fillRect(269,66,26,34);
 c.fillStyle='#c3a35c';c.fillRect(273,72,19,4);c.fillStyle='#b64c3e';c.fillRect(273,81,14,11);
 c.strokeStyle='#a2744b';c.lineWidth=3;c.beginPath();c.moveTo(299,104);c.lineTo(306,125);c.lineTo(292,157);c.stroke();
 c.fillStyle='#d5b94f';c.fillRect(240,110,21,13);c.fillStyle='#202322';for(let j=0;j<4;j++)c.fillRect(240+j*6,110,3,13);
 // Foreground stains, broken shards and prominent floor debris.
 for(let j=0;j<14;j++){let x=(j*73+27)%320,y=158+(j*17)%42,w=3+(j%5)*3;c.fillStyle=j%3===0?'#8a7660':j%3===1?'#58675e':'#171f23';c.fillRect(x,y+beat,w,2+(j%3))}
 // Flickering red alarm casts a visibly moving glow.
 if(Math.sin(t/280)>-.25){c.fillStyle='#a52b2835';c.fillRect(0,0,68,200);c.fillStyle='#df675a';c.fillRect(8,38,21,7)}
 c.restore();
};
/* Chase direction: cinematic over-the-shoulder glance at pursuing zombies. */
const baseDrawScene=drawScene;
drawScene=function(canvas,t=0){
 baseDrawScene(canvas,t);
 if(canvas.dataset.scene!=='pov')return;
 const c=canvas.getContext('2d');
 const phase=t%6900;
 if(phase<1600||phase>3500)return;
 const reveal=Math.min(1,(phase-1600)/300,(3500-phase)/380);
 c.save();c.globalAlpha=Math.max(0,reveal);
 // Turning to look back: receding corridor perspective, pursuers close behind.
 c.fillStyle='#10151c';c.fillRect(0,0,320,200);
 c.fillStyle='#34404b';c.beginPath();c.moveTo(0,0);c.lineTo(320,0);c.lineTo(205,80);c.lineTo(115,80);c.fill();
 c.fillStyle='#293039';c.beginPath();c.moveTo(0,200);c.lineTo(115,80);c.lineTo(205,80);c.lineTo(320,200);c.fill();
 for(let i=0;i<4;i++){let x=60+i*65;c.fillStyle='#3b4b42';c.fillRect(x,95+(i%2)*12,33,53);c.fillStyle='#8b9c72';c.fillRect(x+5,77+(i%2)*12,24,25);c.fillStyle='#f3aa6c';c.fillRect(x+8,86+(i%2)*12,5,3);c.fillRect(x+21,86+(i%2)*12,5,3)}
 // One zombie reaches toward the lens; the arm grows as it approaches.
 const approach=Math.min(1,Math.max(0,(phase-2100)/900)),handScale=.65+approach*1.7;
 c.translate(230,140);c.scale(handScale,handScale);
 c.fillStyle='#778a63';c.fillRect(-12,-4,26,100);c.fillRect(-23,-33,44,39);
 for(let j=0;j<4;j++)c.fillRect(-23+j*11,-66+(j%2)*6,8,40);
 c.fillStyle='#394839';c.fillRect(-23,-33,44,7);c.restore();
};
/* Rebuilt navigation with immersive mobile chase; preserve checkers and endings */
const originalGo=go, originalRender=render;
let chaseTransition=false;
function enterElevator(){
 if(chaseTransition)return;
 chaseTransition=true;
 const overlay=document.createElement('div');overlay.className='door-curtain';overlay.setAttribute('aria-hidden','true');
 overlay.innerHTML='<span></span><span></span>';document.body.append(overlay);
 setTimeout(()=>{overlay.remove();chaseTransition=false;go('elevator')},760);
}
go=function(s){
 originalGo(s);app.dataset.stage=s;
 if(s==='chase'){
  const p=app.querySelector('.panel');
  p.innerHTML='<div class="pov-wrap"><canvas class="pixel-scene pov-scene" data-scene="pov" width="320" height="200" aria-label="Вид от первого лица: бег к лифту"></canvas><div class="hero-bubble">🗯️ Лифт! Я должен успеть!</div><div class="chase-shade"></div></div><div class="actions"></div>';
  p.querySelector('.actions').append(b('ЗАБЕЖАТЬ В ЛИФТ',enterElevator));
  drawPixels();
 }
};
render=function(){originalRender();if(stage==='game')app.dataset.stage='game'};


/* Dedicated authored background artwork, separate from the gameplay canvas. */
const corridorArtwork=new Image();corridorArtwork.src='./assets/industrial-corridor.svg';
const drawWithProceduralArt=drawScene;
drawScene=function(canvas,t=0){
 drawWithProceduralArt(canvas,t);
 if(canvas.dataset.scene!=='pov'||!corridorArtwork.complete||!corridorArtwork.naturalWidth)return;
 const c=canvas.getContext('2d'),phase=t%6900;
 // In the forward-facing portion of the chase the new background is fully visible.
 if(phase>=1550&&phase<=3600)return;
 c.save();c.imageSmoothingEnabled=false;
 const p=Math.min(1,phase/3900),zoom=1+p*.23,bob=Math.sin(t/110)*1.8;
 c.translate(160,100+bob);c.scale(zoom,zoom);c.translate(-160,-100);
 c.drawImage(corridorArtwork,0,0,320,200);
 c.restore();
};


/* Separate zombie asset animated in three staggered pursuit layers. */
const zombieArtwork=new Image();zombieArtwork.src='./assets/zombie.svg';
const previousArtDraw=drawScene;
drawScene=function(canvas,t=0){
 previousArtDraw(canvas,t);
 if(canvas.dataset.scene!=='pov'||!zombieArtwork.complete||!zombieArtwork.naturalWidth)return;
 const phase=t%6900;
 if(phase<1600||phase>3500)return;
 const c=canvas.getContext('2d'),approach=Math.min(1,Math.max(0,(phase-1600)/1750));
 c.save();c.imageSmoothingEnabled=false;
 const runners=[{x:37,y:83,scale:.48},{x:214,y:91,scale:.59},{x:111,y:70,scale:.82}];
 for(let i=0;i<runners.length;i++){
  const z=runners[i],scale=z.scale*(1+approach*.63),w=105*scale,h=165*scale,bob=Math.sin(t/115+i*1.8)*3;
  c.drawImage(zombieArtwork,z.x-(w-105*z.scale)/2,z.y-h*.12+bob,w,h);
 }
 c.restore();
};


/* Smooth checker travel: render-independent ghost animation, no board scaling. */
const originalApplyForMotion=apply;
apply=function(B,m){
 const source=document.querySelectorAll('.board .cell')[m.from[0]*N+m.from[1]];
 const piece=source?.querySelector('.piece');
 const start=piece?.getBoundingClientRect();
 const visual=piece?.cloneNode(true);
 const willCrown=B[m.from[0]][m.from[1]]&&!B[m.from[0]][m.from[1]].king&&((B[m.from[0]][m.from[1]].side==='player'&&m.to[0]===0)||(B[m.from[0]][m.from[1]].side==='ai'&&m.to[0]===N-1));
 originalApplyForMotion(B,m);
 if(!start||!visual||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 requestAnimationFrame(()=>{
  const destination=document.querySelectorAll('.board .cell')[m.to[0]*N+m.to[1]];
  const target=destination?.querySelector('.piece');
  if(!target)return;
  const end=target.getBoundingClientRect();
  const ghost=visual;
  ghost.classList.add('moving-checker');
  ghost.style.cssText='position:fixed!important;left:'+start.left+'px;top:'+start.top+'px;width:'+start.width+'px;height:'+start.height+'px;z-index:9999;pointer-events:none;margin:0;transition:none;transform:none;';
  document.body.append(ghost);
  target.style.visibility='hidden';
  const dx=end.left-start.left,dy=end.top-start.top;
  const anim=ghost.animate([{transform:'translate(0,0)'},{transform:'translate('+dx+'px,'+dy+'px)'}],{duration:260,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'});
  anim.onfinish=()=>{ghost.remove();if(target.isConnected){target.style.visibility='';if(willCrown){target.animate([{filter:'brightness(1)'},{filter:'brightness(2.3)'},{filter:'brightness(1)'}],{duration:420});}}};
  anim.oncancel=()=>{ghost.remove();if(target.isConnected)target.style.visibility=''};
 });
};

/* Procedural soundscape: generated locally, no external audio files required. */
let audioEnabled=true,audioCtx=null,footstepTimer=null;
function soundContext(){if(!audioEnabled)return null;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq=180,duration=.13,type='triangle',volume=.045,slide=1){const a=soundContext();if(!a)return;const o=a.createOscillator(),g=a.createGain(),now=a.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(a.destination);o.start(now);o.stop(now+duration+.01)}
function noise(duration=.18,volume=.08,lowpass=800){const a=soundContext();if(!a)return;const n=Math.floor(a.sampleRate*duration),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();filter.type='lowpass';filter.frequency.value=lowpass;g.gain.value=volume;src.buffer=b;src.connect(filter);filter.connect(g);g.connect(a.destination);src.start()}
function sfx(name){if(!audioEnabled)return;switch(name){case 'step':tone(68,.085,'triangle',.06,.5);noise(.06,.02,230);break;case 'door':tone(115,.65,'sawtooth',.035,.36);noise(.6,.06,390);break;case 'spark':tone(790,.11,'sawtooth',.04,.27);noise(.17,.07,2100);break;case 'hatch':tone(170,.44,'sawtooth',.025,.6);noise(.3,.04,560);break;case 'move':tone(300,.065,'triangle',.035,.7);break;case 'capture':tone(180,.18,'square',.04,.35);break;case 'loss':tone(125,.8,'sawtooth',.06,.3);noise(.65,.1,1200);break;case 'win':tone(360,.35,'sine',.045,1.6);setTimeout(()=>tone(540,.5,'sine',.045,1.4),200);break;}}
function stopSteps(){if(footstepTimer){clearInterval(footstepTimer);footstepTimer=null}}
const soundButton=document.createElement('button');soundButton.className='sound-toggle';soundButton.type='button';soundButton.textContent='🔊';soundButton.setAttribute('aria-label','Выключить звук');soundButton.onclick=()=>{audioEnabled=!audioEnabled;soundButton.textContent=audioEnabled?'🔊':'🔇';soundButton.setAttribute('aria-label',audioEnabled?'Выключить звук':'Включить звук');if(audioEnabled)soundContext()};document.body.append(soundButton);
const priorGoWithLayout=go,priorClickCell=clickCell,priorAiMove=aiMove,priorAiContinue=aiContinue,priorPressFloor=pressFloor,priorEnterElevator=enterElevator,priorStartGame=startGame;
go=function(s){stopSteps();priorGoWithLayout(s);if(s==='chase'){soundContext();sfx('step');footstepTimer=setInterval(()=>{if(stage==='chase')sfx('step');else stopSteps()},370)}if(s==='taxi')sfx('hatch');if(s==='loss')sfx('loss');if(s==='end'&&result==='win')sfx('win')};
enterElevator=function(){sfx('door');priorEnterElevator()};
pressFloor=function(btn){sfx('spark');priorPressFloor(btn)};
clickCell=function(r,c){const before=stage==='game'&&turn==='player'?JSON.stringify(board):null;priorClickCell(r,c);if(before&&before!==JSON.stringify(board))sfx('move')};
aiMove=function(){priorAiMove();sfx('move')};
aiContinue=function(pos){priorAiContinue(pos);sfx('move')};
startGame=function(){stopSteps();priorStartGame()};
</script></body></html>
