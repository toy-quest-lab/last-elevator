<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>Последний лифт — демо 0.2</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#f3ebd7;background:#0b0f1a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#29374a,#080b12 75%)}#app{width:min(100%,520px);min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:16px}.panel{background:#151b29;border:3px solid #516174;box-shadow:0 0 0 4px #080b12,0 15px 40px #0009;padding:18px;border-radius:5px}.logo{font-size:clamp(30px,9vw,54px);font-weight:1000;letter-spacing:2px;text-transform:uppercase;color:#f6e9c8;text-shadow:4px 4px #a42d37,7px 7px #111;text-align:center}.sub{text-align:center;color:#bac4c8;font-size:13px;letter-spacing:2px}button{font:inherit;font-weight:800;color:#fff3d7;background:#9b3740;border:2px solid #e87968;border-bottom:5px solid #612630;border-radius:4px;padding:12px 14px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button.secondary{background:#34435b;border-color:#7185a3;border-bottom-color:#202b3a}button:focus-visible{outline:3px solid #ffde77}button:active{transform:translateY(2px)}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.actions button{flex:1;min-width:130px}.scene{height:255px;position:relative;overflow:hidden;border:3px solid #4a5564;background:linear-gradient(#192a36,#131c29 72%,#2b3035 72%);margin:18px 0}.hall:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 65px,#243442 66px 69px,transparent 70px 130px);opacity:.7}.lamp{position:absolute;left:38%;top:0;width:24%;height:12px;background:#f5d69a;box-shadow:0 0 45px 18px #e1b96c44;animation:flicker 2.8s infinite}.door{position:absolute;bottom:26%;left:34%;width:32%;height:60%;border:7px solid #697786;background:linear-gradient(90deg,#526270 48%,#1d2732 49% 51%,#526270 52%)}.hero{position:absolute;bottom:13%;left:14%;font-size:68px;filter:drop-shadow(4px 5px #0008);animation:bob .45s infinite alternate}.zombies{position:absolute;bottom:12%;right:8%;font-size:53px;animation:bob .7s infinite alternate}.red{color:#fa8581}.screen{background:#080e15;border:2px solid #54616b;padding:13px;text-align:center;color:#e24d4d;font-weight:1000;letter-spacing:2px;margin:12px auto;max-width:240px;text-shadow:0 0 10px #ef434377}.taxi{font-size:72px;text-align:center;animation:peek .65s ease-out}.dialogue{background:#efe1bc;color:#222636;border:3px solid #a89a78;padding:14px;line-height:1.45;min-height:85px;margin-top:14px;font-weight:650}.hud{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:#cad2d8}.board{width:min(100%,420px);aspect-ratio:1;margin:0 auto;border:9px ridge #80604b;display:grid;grid-template-columns:repeat(6,1fr);box-shadow:0 9px 0 #35241f,0 16px 20px #0008}.cell{display:grid;place-items:center;position:relative;padding:0;border:0;border-radius:0;min-width:0;background:#dcc7a1}.cell.dark{background:#664b49}.cell.selected{background:#d6a353}.cell.legal:after{content:"";position:absolute;width:24%;aspect-ratio:1;background:#d7e8a4b8;border-radius:50%;pointer-events:none}.piece{width:76%;height:76%;border-radius:50%;border:3px solid #ffffff55;box-shadow:inset 0 -5px 0 #0004,0 4px 1px #0007;display:grid;place-items:center;font-size:23px;z-index:1}.piece.player{background:#f0ddad;color:#6a442f}.piece.ai{background:#a83f46;color:#ffcf91}.status{text-align:center;min-height:45px;margin:13px 0 4px;font-weight:700;color:#ffe7ad}.foot{font-size:11px;color:#a6b2bc;text-align:center;margin-top:14px}.shake{animation:shake .3s linear}@keyframes bob{to{transform:translateY(-7px)}}@keyframes peek{from{transform:translateY(-110px)}to{transform:translateY(0)}}@keyframes flicker{0%,91%,95%,100%{opacity:1}92%,94%{opacity:.2}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(min-width:560px){#app{min-height:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.loss-panel{overflow:hidden}.loss-scene{height:300px;position:relative;overflow:hidden;background:#101b17;border:5px solid #4e5d65;margin-top:18px;isolation:isolate;image-rendering:pixelated}.loss-dark{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#1d302a 0 20px,#26382f 20px 35px,#101b17 35px 55px);display:grid;place-items:center}.loss-zombies{font-size:64px;animation:zombie-approach 1.5s .7s both;filter:drop-shadow(0 0 12px #8fa643)}.loss-glow{position:absolute;inset:0;box-shadow:inset 0 0 80px #8f3030aa}.loss-door{position:absolute;top:0;height:100%;width:50%;z-index:2;background:repeating-linear-gradient(90deg,#485d65 0 10px,#37464c 10px 15px,#64747a 15px 21px);border:6px solid #26343c;animation-duration:1.4s;animation-delay:.35s;animation-fill-mode:forwards;animation-timing-function:ease-in-out}.loss-door.left{left:0;border-right:4px solid #18242b;animation-name:door-left}.loss-door.right{right:0;border-left:4px solid #18242b;animation-name:door-right}.loss-splash{position:absolute;inset:0;z-index:3;pointer-events:none}.gore-pixel{position:absolute;left:var(--x);top:var(--y);width:var(--sz);height:var(--sz);background:var(--clr);box-shadow:4px 4px 0 #16291c66;opacity:0;transform:scale(0);animation:pixel-pop .4s calc(1.65s + var(--delay)) steps(3,end) forwards}.loss-bone{position:absolute;font-size:28px;opacity:0;animation:bone-pop .3s steps(2,end) forwards}.loss-caption{position:absolute;bottom:12px;left:8px;right:8px;z-index:4;text-align:center;background:#101b20dc;color:#f1e6c5;padding:10px;font-weight:1000;letter-spacing:2px;text-shadow:2px 2px #000}@keyframes door-left{to{transform:translateX(-98%)}}@keyframes door-right{to{transform:translateX(98%)}}@keyframes zombie-approach{from{transform:scale(.4);opacity:.1}to{transform:scale(1.55);opacity:1}}@keyframes pixel-pop{to{opacity:1;transform:scale(1.4)}}@keyframes bone-pop{to{opacity:1;transform:rotate(30deg)}}@media(prefers-reduced-motion:reduce){.loss-door.left{transform:translateX(-98%)}.loss-door.right{transform:translateX(98%)}.gore-pixel,.loss-bone{opacity:1;transform:none}}
</style></head><body><main id="app"></main><script>
const app=document.getElementById('app');let stage='start',board=[],selected=null,turn='player',busy=false,chain=null,result='',hint=false,mode='normal';const N=6;const isDark=(r,c)=>(r+c)%2===1;const inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N;function b(t,fn,cls=''){const el=document.createElement('button');el.textContent=t;el.className=cls;el.onclick=fn;return el}function screen(title,body,buttons=[]){app.innerHTML='';const p=document.createElement('section');p.className='panel';p.innerHTML=`<div class="logo">${title}</div>${body}`;let a=document.createElement('div');a.className='actions';buttons.forEach(([label,fn,cls])=>a.append(b(label,fn,cls||'')));p.append(a);app.append(p)}function go(s){stage=s;if(s==='start')screen('Последний лифт','<p class="sub">ПИКСЕЛЬНЫЙ ХОРРОР · ДЕМО 0.2</p><div class="scene hall"><div class="lamp"></div><div class="door"></div><span class="hero">🏃</span><span class="zombies">🧟🧟</span></div><p>Зомби уже рядом. В конце коридора — единственный работающий лифт. Или почти работающий...</p>',[['НАЧАТЬ',()=>go('chase')],['Правила',()=>go('rules'),'secondary']]);if(s==='rules')screen('Правила','<p>Шашки 6×6: светлые — ваши, красные — противник. Ходите по диагонали. Взятие обязательно; если есть продолжение взятия, ход продолжается. Дамка ходит на любое расстояние по диагонали.</p><p>Цель — забрать все шашки соперника или лишить его ходов. На телефоне нажмите шашку, затем подсвеченную клетку.</p>',[['НАЗАД',()=>go('start')]]);if(s==='chase')screen('ПОГОНЯ','<div class="scene hall"><div class="lamp"></div><div class="door"></div><span class="hero">🏃</span><span class="zombies">🧟🧟</span></div><div class="dialogue">Сзади грохот и хрип. Двери лифта начинают закрываться. Успеешь?</div>',[['ЗАБЕЖАТЬ В ЛИФТ',()=>go('elevator')]]);if(s==='elevator')screen('ЛИФТ','<div class="scene"><div class="lamp"></div><div class="door"></div><div style="position:absolute;top:20px;right:20px;font-size:35px">🔘</div></div><div class="screen">НЕТ МАРШРУТА</div><div class="dialogue">Кнопки оплавились. Лифт не едет. Снаружи кто-то скребёт дверь. Сверху раздаётся кашель...</div>',[['ПОСМОТРЕТЬ ВВЕРХ',()=>go('taxi')]]);if(s==='taxi')screen('ПОПУТЧИК','<div class="taxi">👨🏻‍✈️</div><div class="dialogue">— Командир лифта приветствует вас на борту. Шашечки или ехать?<br><br>— За дверью зомби!<br><br>— Я понял. Значит, шашечки.</div>',[['СЫГРАТЬ',startGame]]);if(s==='loss')showLoss();if(s==='end')screen(result==='win'?'ПОБЕДА':result==='lose'?'РЕЙС ОТМЕНЁН':'НИЧЬЯ',`<div class="taxi">${result==='win'?'🌌':'👨🏻‍✈️'}</div><div class="dialogue">${result==='win'?'— Посадку разрешаю. Следующий этаж — неизвестен!<br>Двери открываются на остановку посреди космоса.':result==='lose'?'— К сожалению, ваша поездка отменяется. Но ожидание уже оплачено.':'— Похоже, никуда мы сегодня не едем. Зато какая партия!'}</div>`,[['ИГРАТЬ СНОВА',startGame],['В НАЧАЛО',()=>go('start'),'secondary']])}
let lossTimer=null;
function showLoss(){
  if(lossTimer)clearTimeout(lossTimer);
  app.innerHTML=`<section class="panel loss-panel"><div class="logo" style="font-size:29px">РЕЙС ОТМЕНЁН</div><div class="loss-scene" aria-label="Двери лифта открываются, за ними зомби, затем экран закрывает пиксельная зелёно-красная масса"><div class="loss-dark"><span class="loss-zombies">🧟 🧟‍♂️ 🧟</span><div class="loss-glow"></div></div><div class="loss-door left"></div><div class="loss-door right"></div><div class="loss-splash" id="loss-splash"></div><div class="loss-caption" id="loss-caption">ДВЕРИ ОТКРЫВАЮТСЯ...</div></div><div class="dialogue">— К сожалению, ваша поездка отменяется. Но ожидание уже оплачено.</div><div class="actions" id="loss-actions"></div></section>`;
  const splash=document.getElementById('loss-splash');
  for(let i=0;i<110;i++){
    const dot=document.createElement('i');dot.className='gore-pixel';
    const seed=(i*73+19)%101;
    dot.style.setProperty('--x',`${(i*37+11)%100}%`);
    dot.style.setProperty('--y',`${(i*61+7)%100}%`);
    dot.style.setProperty('--delay',`${(i%17)*34}ms`);
    dot.style.setProperty('--sz',`${8+(seed%5)*9}px`);
    dot.style.setProperty('--clr',i%9<4?'#547b35':i%9<7?'#922b34':'#c4bd8c');
    splash.append(dot);
  }
  for(let i=0;i<12;i++){
    const bone=document.createElement('span');bone.className='loss-bone';bone.textContent='🦴';bone.style.left=`${(i*47+8)%90}%`;bone.style.top=`${(i*31+12)%85}%`;bone.style.animationDelay=`${.65+(i%6)*.11}s`;splash.append(bone);
  }
  lossTimer=setTimeout(()=>{if(stage!=='loss')return;document.getElementById('loss-caption').textContent='ПОЕЗДКА ОКОНЧЕНА';const actions=document.getElementById('loss-actions');actions.append(b('РЕВАНШ',startGame),b('В НАЧАЛО',()=>go('start'),'secondary'));},2600);
}
function startGame(){if(lossTimer)clearTimeout(lossTimer);board=Array.from({length:N},()=>Array(N).fill(null));for(let r=0;r<2;r++)for(let c=0;c<N;c++)if(isDark(r,c))board[r][c]={side:'ai',king:false};for(let r=4;r<6;r++)for(let c=0;c<N;c++)if(isDark(r,c))board[r][c]={side:'player',king:false};turn='player';busy=false;selected=null;chain=null;hint=false;stage='game';render()}
const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];function movesFor(B,r,c,captureOnly=false){let p=B[r]?.[c];if(!p)return [];let captures=[],normal=[];for(const [dr,dc] of dirs){if(p.king){let rr=r+dr,cc=c+dc,enemy=null;while(inside(rr,cc)){let q=B[rr][cc];if(!enemy){if(q){if(q.side===p.side)break;enemy=[rr,cc]}else if(!captureOnly)normal.push({from:[r,c],to:[rr,cc]})}else{if(q)break;captures.push({from:[r,c],to:[rr,cc],cap:enemy})}rr+=dr;cc+=dc}}else{let er=r+dr,ec=c+dc,tr=r+2*dr,tc=c+2*dc;if(inside(tr,tc)&&B[er][ec]&&B[er][ec].side!==p.side&&!B[tr][tc])captures.push({from:[r,c],to:[tr,tc],cap:[er,ec]});if(!captureOnly&&dr===(p.side==='player'?-1:1)&&inside(er,ec)&&!B[er][ec])normal.push({from:[r,c],to:[er,ec]})}}return captures.length?captures:normal}
function allMoves(B,side,forced=null){let captures=[],normal=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(B[r][c]?.side!==side||(forced&&(forced[0]!==r||forced[1]!==c)))continue;let ms=movesFor(B,r,c,!!forced);for(const m of ms)(m.cap?captures:normal).push(m)}return captures.length?captures:(forced?[]:normal)}
function apply(B,m){let [r,c]=m.from,[tr,tc]=m.to,p=B[r][c];B[r][c]=null;B[tr][tc]=p;if(m.cap)B[m.cap[0]][m.cap[1]]=null;if(!p.king&&(tr===0&&p.side==='player'||tr===N-1&&p.side==='ai'))p.king=true}
function endCheck(){let me=allMoves(board,'player'),ai=allMoves(board,'ai');if(!me.length||!ai.length){result=!ai.length?'win':'lose';go(result==='lose'?'loss':'end');return true}return false}
function render(){if(stage!=='game')return;app.innerHTML='';let p=document.createElement('section');p.className='panel';p.innerHTML='<div class="logo" style="font-size:29px">ШАШЕЧКИ ИЛИ ЕХАТЬ?</div><div class="hud"><span>🚕 Лифтёр</span><span>6 × 6</span><span>🙂 Вы</span></div>';let boardEl=document.createElement('div');boardEl.className='board';let legal=turn==='player'?allMoves(board,'player',chain):[];let target=selected?legal.filter(m=>m.from[0]===selected[0]&&m.from[1]===selected[1]):[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){let cell=document.createElement('button');cell.className='cell '+(isDark(r,c)?'dark ':'')+(selected?.[0]===r&&selected?.[1]===c?'selected ':'')+(target.some(m=>m.to[0]===r&&m.to[1]===c)?'legal':'');cell.setAttribute('aria-label',`Клетка ${r+1},${c+1}`);let q=board[r][c];if(q){let piece=document.createElement('div');piece.className='piece '+q.side;piece.textContent=q.king?'♛':'';cell.append(piece)}cell.onclick=()=>clickCell(r,c);boardEl.append(cell)}p.append(boardEl);let status=document.createElement('div');status.className='status';status.textContent=busy?'Лифтёр думает...':chain?'Продолжайте взятие!':turn==='player'?'Ваш ход. '+(legal.some(m=>m.cap)?'Взятие обязательно!':'Выберите шашку.'):'Ход лифтёра';p.append(status);let actions=document.createElement('div');actions.className='actions';actions.append(b('Заново',startGame,'secondary'),b('Выйти',()=>go('start'),'secondary'));p.append(actions);let foot=document.createElement('div');foot.className='foot';foot.textContent='Демо 0.2 • русские шашки на доске 6×6 • без сервера';p.append(foot);app.append(p)}
function clickCell(r,c){if(stage!=='game'||busy||turn!=='player')return;let ms=allMoves(board,'player',chain);if(selected){let m=ms.find(m=>m.from[0]===selected[0]&&m.from[1]===selected[1]&&m.to[0]===r&&m.to[1]===c);if(m){apply(board,m);selected=null;if(m.cap){let next=allMoves(board,'player',[r,c]);if(next.some(x=>x.cap)){chain=[r,c];selected=[r,c];render();return}}chain=null;if(endCheck())return;turn='ai';busy=true;render();setTimeout(aiMove,400);return}}if(board[r][c]?.side==='player'&&ms.some(m=>m.from[0]===r&&m.from[1]===c))selected=[r,c];else if(!chain)selected=null;render()}
function aiMove(){if(stage!=='game')return;let ms=allMoves(board,'ai');if(!ms.length){result='win';go('end');return}let scored=ms.map(m=>({m,score:(m.cap?8:0)+(m.to[0]-m.from[0])*.4+(2.5-Math.abs(2.5-m.to[1]))*.15+Math.random()*.6}));scored.sort((a,b)=>b.score-a.score);let m=scored[0].m;apply(board,m);if(m.cap){let next=allMoves(board,'ai',m.to).filter(x=>x.cap);if(next.length){render();setTimeout(()=>aiContinue(m.to),350);return}}finishAI()}
function aiContinue(pos){if(stage!=='game')return;let next=allMoves(board,'ai',pos).filter(x=>x.cap);if(!next.length){finishAI();return}let m=next[Math.floor(Math.random()*next.length)];apply(board,m);render();setTimeout(()=>aiContinue(m.to),350)}function finishAI(){busy=false;turn='player';if(endCheck())return;render()}
go('start');
</script></body></html>
